        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.levinschwab.scanlite
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Store-Signierung gehoert in die Quelle, nicht in die erzeugte
        # pbxproj: dort ueberlebt sie kein xcodegen generate.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "GEO scanlite AppStore"
          DEVELOPMENT_TEAM: R95M36AU2X

  PaperlaneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaperlaneTests
      - path: Paperlane/Resources/Paperlane.storekit
        buildPhase: resources
    dependencies:
      - target: Paperlane
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.levinschwab.scanlite.tests
        GENERATE_INFOPLIST_FILE: YES
