name: ScanLite
options:
  bundleIdPrefix: de.levinschwab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: R95M36AU2X
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.0.0"

targets:
  ScanLite:
    type: application
    platform: iOS
    sources:
      - path: ScanLite
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    scheme:
      testTargets:
        - ScanLiteTests
      storeKitConfiguration: ScanLite/Resources/ScanLite.storekit
    info:
      path: ScanLite/Info.plist
      properties:
        CFBundleDisplayName: ScanLite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "ScanLite uses the camera to scan your documents into PDFs. Pages are processed on your device and never uploaded."
        NSPhotoLibraryUsageDescription: "ScanLite imports photos you choose so you can turn them into clean, searchable PDFs. Images are processed on your device."
        NSFaceIDUsageDescription: "ScanLite uses Face ID to lock your document library on this device."
        NSContactsUsageDescription: "ScanLite can save a scanned business card directly to your Contacts."
        NSUserTrackingUsageDescription: "We use your data to show you more relevant ads."
        GADApplicationIdentifier: "ca-app-pub-6563643868702361~9176869594"
        SKAdNetworkItems:
