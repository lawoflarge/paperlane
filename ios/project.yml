name: Paperlane
options:
  bundleIdPrefix: de.levinschwab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CROSS_PROMOTION_BASE_URL: ""
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: R95M36AU2X
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1787942199"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  CrossPromotion:
    url: https://github.com/lawoflarge/lawoflarge.app.git
    revision: 02e0df23fb13e2b6f3326b137ed426107f458beb
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.0.0"

targets:
  Paperlane:
    type: application
    platform: iOS
    sources:
      - path: Paperlane
    dependencies:
      - package: CrossPromotion
        product: CrossPromotionUI
      - package: CrossPromotion
        product: CrossPromotionCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    scheme:
      testTargets:
        - PaperlaneTests
      storeKitConfiguration: Paperlane/Resources/Paperlane.storekit
    info:
      path: Paperlane/Info.plist
      properties:
        CrossPromotionBaseURL: "$(CROSS_PROMOTION_BASE_URL)"
        CFBundleDisplayName: Paperlane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Paperlane uses the camera to scan your documents into PDFs. Pages are processed on your device and never uploaded."
        NSPhotoLibraryUsageDescription: "Paperlane imports photos you choose so you can turn them into clean, searchable PDFs. Images are processed on your device."
        NSFaceIDUsageDescription: "Paperlane uses Face ID to lock your document library on this device."
        NSContactsUsageDescription: "Paperlane can save a scanned business card directly to your Contacts."
        NSUserTrackingUsageDescription: "We use your data to show you more relevant ads."
        GADApplicationIdentifier: "ca-app-pub-6563643868702361~9176869594"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
