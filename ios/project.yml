        PRODUCT_BUNDLE_IDENTIFIER: de.levinschwab.scanlite
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ScanLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScanLiteTests
      - path: ScanLite/Resources/ScanLite.storekit
        buildPhase: resources
    dependencies:
      - target: ScanLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.levinschwab.scanlite.tests
        GENERATE_INFOPLIST_FILE: YES
