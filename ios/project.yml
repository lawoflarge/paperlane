name: ScanLite
options:
  bundleIdPrefix: de.levinschwab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: R95M36AU2X
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ScanLite:
    type: application
    platform: iOS
    sources:
      - path: ScanLite
    scheme:
      testTargets:
        - ScanLiteTests
      storeKitConfiguration: ScanLite/Resources/ScanLite.storekit
    info:
      path: ScanLite/Info.plist
      properties:
        CFBundleDisplayName: ScanLite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "ScanLite uses the camera to scan your documents into PDFs. Pages are processed on your device and never uploaded."
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.levinschwab.scanlite
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  ScanLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScanLiteTests
      - path: ScanLite/Resources/ScanLite.storekit
        buildPhase: resources
    dependencies:
      - target: ScanLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.levinschwab.scanlite.tests
        GENERATE_INFOPLIST_FILE: YES
